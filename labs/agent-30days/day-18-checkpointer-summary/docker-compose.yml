# D18 的检查点存储。宿主端口 5518（W3 口径：5500 + 天号），避开其他 lab 的 Postgres。
# 起来之后：
#   docker compose up -d
#   cd solution && DATABASE_URL=postgres://agent:agent@localhost:5518/agent_d18 SELFTEST=1 MOCK=1 pnpm start
# 不设 DATABASE_URL 就走内存版，跑的是同一份图、同一份自检。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_d18
    ports:
      - '5518:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_d18']
      interval: 3s
      timeout: 3s
      retries: 20
