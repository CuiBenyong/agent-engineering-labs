# 本 lab 自己的 Postgres。跑起来之后设置
#   DATABASE_URL=postgres://koda:koda@127.0.0.1:5519/koda
# 再跑同一条自检命令，业务代码一行不变（差别只在 src/infra/real.ts）。
# 端口故意错开仓库根 docker-compose.yml 的 5433，避免和网站的库撞上。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: koda
      POSTGRES_DB: koda
    ports:
      - '5519:5432'
