# D2 实验用的 PostgreSQL 16 + pgvector。端口按课程口径取 5500 + 天号（D2 的天号是 52）。
# 起停：docker compose up -d / docker compose down -v
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag14-day02-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - '5552:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
