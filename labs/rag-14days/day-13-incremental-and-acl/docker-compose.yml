# D13 实验用的 PostgreSQL 16 + pgvector。端口按课程口径取 5500 + 天号（D13 的天号是 63）。
# 起停：docker compose up -d / docker compose down -v
#
# 不用它也能跑：MOCK=1 时索引走内存实现，语义与 SQL 版一致，只是没有索引、走全表扫描。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag14-day13-pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - '5563:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
